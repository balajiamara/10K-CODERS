<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mosaic View</title>
  <style>
    body {
      background: #f7f7f7;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* justify-con: center; */
    }

    h1 {
      text-align: center;
      margin: 40px 0 20px;
      color: #333;
      font-family: Georgia, 'Times New Roman', Times, serif;
      text-shadow: 2px 2px 4px rgba(202, 29, 29, 0.4);
    }

    .mosaic-grid {
      display: grid;
      grid-template-columns: repeat(6,1fr);
      grid-auto-rows: 150px;
      gap: 30px;
      /* max-width: 1000px; */
      width: 100%;
      /* height: 200vh; */
      padding: 10px;
      border-radius: 82px;
      /* margin-left: 80px; */
      /* background-color: black; */
      overflow: hidden;
      justify-items: center;
    }
    /* img{
      width: 100%;
      height: 100%;
    } */
    .mosaic-grid img {
      width: 50%;
      height: 100%;
      object-fit: cover;
      /* border-radius: 12px; */
      display: block;
    }

    /* Optional: Make some images span more rows/columns */
    /* .mosaic-grid img.wide {
      grid-column: span 2;
    }

    .mosaic-grid img.tall {
      grid-row: span 2;
    }

    .mosaic-grid img.big {
      grid-column: span 2;
      grid-row: span 2;
    } */
    .mosaic-grid>#img1{
        grid-column: 1/3;
        grid-row: 1/3;
    }
    .mosaic-grid>#img2{
        grid-column: 2/4;
        grid-row: 1/2;
    }
    .mosaic-grid>#img3{
        grid-column: 3/5;
        grid-row: 1/3;
    }
    .mosaic-grid>#img4{
        grid-column: 4/6;
        grid-row: 1/3;
    }
    .mosaic-grid>#img5{
        grid-column: 5/7;
        grid-row: 1/4;
    }
    .mosaic-grid>#img6{
        grid-column: 1/3;
        grid-row: 3/5;
    }
    .mosaic-grid>#img7{
        grid-column: 2/4;
        grid-row: 2/4;
    }
    .mosaic-grid>#img8{
        grid-column: 3/5;
        grid-row: 3/6;
    }
    .mosaic-grid>#img9{
        grid-column: 4/6;
        grid-row: 3/5;
    }
    .mosaic-grid>#img10{
        grid-column: 1/3;
        grid-row: 5/9;
    }
    /* .mosaic-grid>#img11{
        grid-column: 1/3;
        grid-row: 5/7;
    } */
    .mosaic-grid>#img11{
        grid-column: 2/4;
        grid-row: 4/10;
    }
    .mosaic-grid>#img12{
        grid-column: 3/5;
        grid-row: 6/11;
    }
    .mosaic-grid>#img13{
        grid-column: 4/6;
        grid-row: 5/8;
    }
    .mosaic-grid>#img14{
        grid-column: 5/7;
        grid-row: 4/9;
    }
    .mosaic-grid>#img15{
        grid-column:1/3 ;
        grid-row: 9/11;
    }
    .mosaic-grid>#img16{
        grid-column:2/4 ;
        grid-row: 10/11;
    }
    .mosaic-grid>#img17{
        grid-column:4/6 ;
        grid-row: 8/11;
    }
    .mosaic-grid>#img18{
        grid-column:5/7 ;
        grid-row: 9/11;
    }
  </style>
</head>
<body>

  <h1>Mosaic View</h1>
